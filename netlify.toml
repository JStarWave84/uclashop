# Netlify configuration
[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

# SPA fallback: every route serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Inject dynamic Open Graph tags for store and product pages
[[edge_functions]]
  path = "/tiendas/*"
  function = "store-og"

[[edge_functions]]
  path = "/productos/*"
  function = "store-og"

# Dynamic robots.txt (Sitemap URL resolved from the request origin)
[[edge_functions]]
  path = "/robots.txt"
  function = "robots"

# Dynamic sitemap.xml: static routes + active products + verified stores
[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"
